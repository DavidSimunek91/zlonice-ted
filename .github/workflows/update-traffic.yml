name: Update traffic data

# Pravidelně (mimo běh appky v prohlížeči) stáhne dopravní data z ŘSD/NDIC
# a uloží zjednodušený výsledek do data/traffic.json. Appka pak ten soubor
# jen čte jako obyčejný statický JSON — API klíč nikdy nejde do klientského
# kódu, zůstává jen tady jako GitHub Actions secret.
#
# Setup: Settings → Secrets and variables → Actions → New repository secret
#   RSD_USERNAME, RSD_PASSWORD = přístupové údaje k odběru "DATEX II -
#   Běžné dopravní informace v2 (snímek)" z mobilitydata.rsd.cz (Basic Auth,
#   ne API klíč v hlavičce)
#   RSD_PROXY_URL, PROXY_KEY = adresa a klíč Cloudflare Workeru, který
#   požadavek přeposílá na ŘSD (GitHub Actions runnery mají odsud connect
#   timeout, viz komentář ve scripts/update-traffic.mjs). Bez těchto dvou
#   secretů skript volá ŘSD přímo.
# Dokud RSD_USERNAME/RSD_PASSWORD nejsou nastavené, skript se sám ukončí bez chyby a nic nemění.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-save

      - name: Fetch and transform traffic data
        env:
          RSD_USERNAME: ${{ secrets.RSD_USERNAME }}
          RSD_PASSWORD: ${{ secrets.RSD_PASSWORD }}
          RSD_PROXY_URL: ${{ secrets.RSD_PROXY_URL }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
        run: node scripts/update-traffic.mjs

      - name: Commit if changed
        run: |
          git config user.name "traffic-data-bot"
          git config user.email "actions@github.com"
          git add data/traffic.json
          git diff --staged --quiet && { echo "Beze změny, nic k odeslání."; exit 0; }
          git commit -m "Update traffic data [skip ci]"

          # Víc pipeline v tomhle repu (traffic/water/alerts/departures) běží na
          # stejný časovač a občas si šlápnou na paty při pushi do main — bez
          # rebase+retry to shodí celý běh do červena, i když se data samotná
          # v pořádku stáhla (viz krok výš).
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push odmítnut (pokus $attempt/5), rebasuju na aktuální main a zkouším znovu…"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "::error::Push se nepovedl ani po 5 pokusech."
          exit 1
