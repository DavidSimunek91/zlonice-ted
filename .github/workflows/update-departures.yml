name: Update bus departures

# Stahuje PID GTFS statická data (jízdní řády, ne živou polohu) a filtruje
# je na linky/zastávky kolem Zlonic. Veřejná data (CC-BY), žádný secret
# není potřeba. PID GTFS se sám generuje jen jednou denně (~4:00-4:30),
# takže častější běh nemá smysl — appka si "další odjezdy" počítá sama
# z aktuálního data/dne, viz scripts/update-departures.mjs.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and filter PID GTFS data
        run: node scripts/update-departures.mjs

      - name: Commit if changed
        run: |
          git config user.name "departures-data-bot"
          git config user.email "actions@github.com"
          git add data/departures.json
          git diff --staged --quiet && { echo "Beze změny, nic k odeslání."; exit 0; }
          git commit -m "Update bus departures [skip ci]"

          # Víc pipeline v tomhle repu (traffic/water/alerts/departures) běží na
          # stejný časovač a občas si šlápnou na paty při pushi do main — bez
          # rebase+retry to shodí celý běh do červena, i když se data samotná
          # v pořádku stáhla (viz krok výš).
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push odmítnut (pokus $attempt/5), rebasuju na aktuální main a zkouším znovu…"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "::error::Push se nepovedl ani po 5 pokusech."
          exit 1
