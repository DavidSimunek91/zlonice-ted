name: Update live bus delays

# Živé zpoždění spojů (Golemio API) na zastávkách kolem Zlonic — doplňuje
# denní jízdní řád (update-departures.yml) o to, co se mění v řádu minut,
# ne jednou za den. Dokud repo secret GOLEMIO_API_KEY není nastavený,
# skript nic nevolá a appka jen dál ukazuje jízdní řád beze zpoždění.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live bus delays
        env:
          GOLEMIO_API_KEY: ${{ secrets.GOLEMIO_API_KEY }}
        run: node scripts/update-live-departures.mjs

      - name: Commit if changed
        run: |
          git config user.name "live-departures-bot"
          git config user.email "actions@github.com"
          git add data/live-departures.json
          git diff --staged --quiet && { echo "Beze změny, nic k odeslání."; exit 0; }
          git commit -m "Update live bus delays [skip ci]"

          # Víc pipeline v tomhle repu (traffic/water/alerts/departures) běží na
          # stejný časovač a občas si šlápnou na paty při pushi do main — bez
          # rebase+retry to shodí celý běh do červena, i když se data samotná
          # v pořádku stáhla (viz krok výš). Tenhle workflow běží co 5 minut,
          # takže je na kolizi náchylnější než ostatní.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push odmítnut (pokus $attempt/5), rebasuju na aktuální main a zkouším znovu…"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "::error::Push se nepovedl ani po 5 pokusech."
          exit 1
