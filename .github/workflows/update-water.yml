name: Update water data

# Nahrazuje dřívější ručně vkládaný snímek vody živými daty ze stanice
# Velvary (ČHMÚ hydrologie). ČHMÚ tahle data aktualizuje každých 10 minut,
# takže i appka se je snaží držet čerstvá. Veřejná data, žádný secret.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live water data
        run: node scripts/update-water.mjs

      - name: Commit if changed
        run: |
          git config user.name "water-data-bot"
          git config user.email "actions@github.com"
          git add data/water.json
          git diff --staged --quiet && { echo "Beze změny, nic k odeslání."; exit 0; }
          git commit -m "Update water data [skip ci]"

          # Víc pipeline v tomhle repu (traffic/water/alerts/departures) běží na
          # stejný časovač a občas si šlápnou na paty při pushi do main — bez
          # rebase+retry to shodí celý běh do červena, i když se data samotná
          # v pořádku stáhla (viz krok výš).
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push odmítnut (pokus $attempt/5), rebasuju na aktuální main a zkouším znovu…"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "::error::Push se nepovedl ani po 5 pokusech."
          exit 1
