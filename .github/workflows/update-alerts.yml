name: Update ČHMÚ alerts

# Stahuje aktuální CAP výstrahy ČHMÚ a filtruje je na ORP Slaný (Zlonice).
# Veřejná data, žádný secret není potřeba.
#
# Bez automatického časovače: skutečný zdroj pravdy je teď droplet cron
# (infra/do-pipelines/, běží stejný scripts/update-alerts.mjs mnohem
# spolehlivěji než GitHub Actions scheduler — viz jeho README.md). Když
# tenhle workflow běžel na schedule souběžně s droplem, občas si oba pushe
# šláply na paty a skončilo to skutečným merge konfliktem v data/alerts.json
# (dva nezávisle vypočtené výsledky, ne jen "fast-forward" kolize) — bez
# opravitelný retry smyčkou, jen zbytečný failed e-mail. Workflow zůstává
# pro ruční spuštění (workflow_dispatch), např. při ladění.

on:
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-save

      - name: Fetch and filter ČHMÚ alerts
        run: node scripts/update-alerts.mjs

      - name: Commit if changed
        run: |
          git config user.name "alerts-data-bot"
          git config user.email "actions@github.com"
          git add data/alerts.json
          git diff --staged --quiet && { echo "Beze změny, nic k odeslání."; exit 0; }
          git commit -m "Update ČHMÚ alerts [skip ci]"

          # Víc pipeline v tomhle repu (traffic/water/alerts/departures) běží na
          # stejný časovač a občas si šlápnou na paty při pushi do main — bez
          # rebase+retry to shodí celý běh do červena, i když se data samotná
          # v pořádku stáhla (viz krok výš).
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push odmítnut (pokus $attempt/5), rebasuju na aktuální main a zkouším znovu…"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "::error::Push se nepovedl ani po 5 pokusech."
          exit 1
